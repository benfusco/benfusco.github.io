    <!-- Title area -->
    <section class="prec-intro">
        <h1>Precedents</h1>
        <p>This is a tool which allows for the organization of projects for easy recall</p>
    </section>

    <!-- Matrix -->
    <main id="view">
        <div id="matrix"></div>
    </main>

    <!-- View switch -->
    <div class="prec-views">
        <button class="on" data-v="matrix">Matrix</button>
        <button data-v="timeline">Timeline</button>
        <button data-v="map">Map</button>
    </div>

   <!-- Add / edit project -->
    <section id="editor" class="prec-editor">
        <h2>Add / edit project</h2>
 
        <label>Access token<input id="e_token" type="password" autocomplete="off"></label>
 
        <label>Edit existing<select id="e_pick"></select></label>
        <label>Title<input id="e_title"></label>
        <label>Type
            <select id="e_type">
                <option value="">Choose a type</option>
                <option>Building</option>
                <option>Hypothetical</option>
                <option>Writing</option>
                <option>Drawing</option>
                <option>Painting</option>
                <option>Sculpture</option>
            </select>
        </label>
        <div class="prec-row">
            <label>Year<input id="e_year" type="number" min="1000" max="2100"></label>
            <label>Designer<input id="e_designer" list="e_designers"></label>
        </div>
        <datalist id="e_designers"></datalist>
        <label>Location (city, region, country)<input id="e_location"></label>
        <label>URL<input id="e_url" type="url" placeholder="https://"></label>
        <div class="prec-row">
            <label>Image URL (optional)<input id="e_image" type="url" placeholder="https://"></label>
            <label>Or upload an image<input id="e_file" type="file" accept="image/*"></label>
        </div>
        <div class="prec-actions">
            <button type="button" id="e_save">Add project</button>
            <button type="button" id="e_clear">Clear</button>
            <button type="button" id="e_delete" hidden>Delete</button>
        </div>
        <p id="e_msg" role="status"></p>
    </section>
